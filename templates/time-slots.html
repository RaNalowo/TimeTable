<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Time Slots</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f3f4f6; margin: 0; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; padding: 16px 24px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
      flex-wrap: wrap; gap: 12px;
    }
    header h1 { margin: 0; font-size: 20px; }

    .panel {
      background: #fff; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
    }
    .panel h2 { margin-top: 0; font-size: 16px; }

    /* ---- form layout ---- */
    form#slotForm {
      display: grid;
      gap: 12px;
      grid-template-columns: 2fr 1fr 1fr auto;
      align-items: start;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    form#slotForm input,
    form#slotForm select {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
    }
    form#slotForm input.input-error {
      border: 2px solid #dc2626;
    }
    form#slotForm button {
      padding: 9px 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      height: 38px;
      align-self: start;
    }
    form#slotForm button:hover { background: #1d4ed8; }

    .field-msg {
      color: #dc2626;
      font-size: 12px;
      min-height: 16px;
    }

    #formMsg { margin: 8px 0 0; font-size: 13px; min-height: 18px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9fafb; font-weight: 600; }
    tr:hover { background: #f9fafb; }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 12px;
    }
    .badge-active { background: #dcfce7; color: #166534; }
    .badge-inactive { background: #f3f4f6; color: #6b7280; }

    .btn-edit {
      padding: 4px 10px; background: #0891b2; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
      margin-right: 4px;
    }
    .btn-del {
      padding: 4px 10px; background: #dc2626; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
    }

    /* ---- Highlight problematic rows ---- */
    tr.row-error {
      background: #fef2f2 !important;
      box-shadow: inset 4px 0 0 #dc2626;
    }
    tr.row-error td {
      color: #991b1b;
      font-weight: 500;
    }
    tr.row-error td:first-child::before {
      content: "⚠ ";
      color: #dc2626;
    }

    /* ---- Check button ---- */
    .check-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .btn-check {
      padding: 8px 16px;
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .btn-check:hover { background: #047857; }

    #checkResult {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }

    /* ---- Issue cards ---- */
    .issue-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: #fef2f2;
      border-left: 4px solid #dc2626;
      animation: fadeIn 0.25s ease;
    }
    .issue-card .icon {
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
    }
    .issue-card .body {
      flex: 1;
      font-size: 13px;
      line-height: 1.5;
      color: #7f1d1d;
    }
    .issue-card .type-tag {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: #fecaca;
      color: #991b1b;
      margin-right: 8px;
    }
    .issue-card .msg {
      color: #7f1d1d;
    }

    .issue-card.ok {
      background: #f0fdf4;
      border-left-color: #16a34a;
    }
    .issue-card.ok .body { color: #166534; }
    .issue-card.ok .type-tag {
      background: #bbf7d0;
      color: #166534;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Monospace slot labels for easier reading */
    #slotTable td:first-child {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-mount"></div>
    <main class="main-content">

      <header>
        <h1>Manage Teaching Time Slots</h1>
        <span id="countLabel" style="font-size:13px;color:#666;"></span>
      </header>

      <div class="panel" id="formPanel" style="display:none;">
        <h2 id="formTitle">Add Time Slot</h2>

        <form id="slotForm" novalidate>

          <div class="form-field">
            <input id="slot_label" placeholder="Slot (e.g., 08:30-09:20)" />
            <div class="field-msg" id="slot_labelMsg"></div>
          </div>

          <div class="form-field">
            <input id="sort_order" type="text" inputmode="numeric" placeholder="Sort order (1-10)" />
            <div class="field-msg" id="sort_orderMsg"></div>
          </div>

          <div class="form-field">
            <select id="is_active">
              <option value="true">Active</option>
              <option value="false">Inactive</option>
            </select>
            <div class="field-msg" id="is_activeMsg"></div>
          </div>

          <button type="submit" id="formSubmitBtn">Save Slot</button>
        </form>

        <p id="formMsg"></p>
      </div>

      <div class="panel">
        <h2>Time Slot Directory</h2>
        <p id="accessMsg" style="font-size:13px;color:#888;"></p>

        <div class="check-bar">
          <button class="btn-check" onclick="checkTimeSlotConsistency()">
            Check Consistency
          </button>
          <span id="checkResult"></span>
        </div>

        <div id="issueList" style="display:none;"></div>

        <table>
          <thead>
            <tr>
              <th>Slot</th>
              <th>Sort Order</th>
              <th>Status</th>
              <th id="actionCol">Actions</th>
            </tr>
          </thead>
          <tbody id="slotTable"></tbody>
        </table>
      </div>

    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
