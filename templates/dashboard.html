<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f3f4f6; margin: 0; padding: 24px; }

    .container { max-width: 1000px; margin: 0 auto; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; padding: 16px 24px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
      flex-wrap: wrap; gap: 12px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header .user { font-size: 14px; color: #555; margin-top: 4px; }
    header button {
      padding: 8px 16px; background: #dc2626; color: #fff;
      border: none; border-radius: 6px; cursor: pointer;
    }
    header button:hover { background: #b91c1c; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .card {
      background: #fff; padding: 16px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 22px; font-weight: bold; margin-top: 6px; }

    .panel {
      background: #fff; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
    }
    .panel h2 { margin-top: 0; font-size: 16px; }
    .panel p { margin: 6px 0; font-size: 14px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9fafb; font-weight: 600; }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 12px; background: #e0e7ff; color: #3730a3;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .actions button {
      padding: 10px 16px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .actions button:hover { background: #1d4ed8; }

    /* Add User form */
    #addUserForm { display: grid; gap: 10px; max-width: 420px; }
    #addUserForm input, #addUserForm select {
      padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }
    #addUserForm button {
      padding: 10px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    #addUserForm button:hover { background: #1d4ed8; }
    #addUserMsg { font-size: 13px; min-height: 18px; margin: 0; }

    #adminUsers { padding-left: 20px; font-size: 14px; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      header h1 { font-size: 18px; }
      .card .value { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <div>
        <h1 id="welcome">Welcome</h1>
        <div class="user" id="userInfo">Loading...</div>
      </div>
      <button onclick="logout()">Logout</button>
    </header>

    <div class="cards" id="cards"></div>

    <div class="panel" id="rolePanel"></div>

    <div class="panel">
      <h2>Quick Actions</h2>
      <div class="actions">
        <button onclick="go('timetable')">View Timetable</button>
        <button onclick="window.location.href='/rooms.html'">Manage Rooms</button>
        <button onclick="go('export')">Export</button>
        <button onclick="go('requests')">Requests</button>
      </div>
    </div>

    <!-- Admin only -->
    <div class="panel" id="adminPanel" style="display:none;">
      <h2>Admin · Add User</h2>
      <form id="addUserForm">
        <input id="newEmail" type="email" placeholder="Email" required />
        <input id="newFullName" placeholder="Full name" required />
        <input id="newPassword" type="password" placeholder="Password" required />
        <select id="newRole">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="admin">Admin</option>
        </select>
        <input id="newStudentId" placeholder="Student ID (optional)" />
        <input id="newEmployeeId" placeholder="Employee ID (optional)" />
        <button type="submit">Create User</button>
        <p id="addUserMsg"></p>
      </form>

      <h2 style="margin-top:24px;">Admin · User List</h2>
      <button onclick="loadAdminUsers()" style="padding:8px 16px; background:#2563eb; color:#fff; border:none; border-radius:6px; cursor:pointer;">Load Users</button>
      <ul id="adminUsers"></ul>
    </div>

  </div>
  <script src="/static/app.js"></script>
</body>
</html>
