<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Student Groups</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f3f4f6; margin: 0; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; padding: 16px 24px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
      flex-wrap: wrap; gap: 12px;
    }
    header h1 { margin: 0; font-size: 20px; }

    .panel {
      background: #fff; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
    }
    .panel h2 { margin-top: 0; font-size: 16px; }

    form#groupForm {
      display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      align-items: start;
    }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    input, select {
      padding: 8px 10px; border: 1px solid #ccc;
      border-radius: 6px; font-size: 14px; width: 100%; height: 38px;
    }
    input:disabled, select:disabled { background: #e5e7eb; cursor: not-allowed; }
    input.input-error, select.input-error { border: 2px solid #dc2626; }
    button[type="submit"] {
      padding: 9px 14px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; height: 38px;
    }
    .field-msg { color: #dc2626; font-size: 12px; min-height: 16px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9fafb; font-weight: 600; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; background: #e0e7ff; color: #3730a3; }
    .badge-dept { background: #fef3c7; color: #92400e; }
    .badge-track { background: #dcfce7; color: #166534; }

    .btn-edit { padding: 4px 10px; background: #0891b2; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 4px; }
    .btn-del { padding: 4px 10px; background: #dc2626; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-mount"></div>
    <main class="main-content">

      <header>
        <h1>Manage Student Groups</h1>
        <span id="countLabel" style="font-size:13px; color:#666;"></span>
      </header>

      <div class="panel" id="formPanel" style="display:none;">
        <h2 id="formTitle">Add Student Group</h2>
        <form id="groupForm" novalidate>
          <div class="form-field">
            <input id="group_code" placeholder="Group code (e.g., IS-23-AI)" />
            <div class="field-msg" id="group_codeMsg"></div>
          </div>
          <div class="form-field">
            <select id="department" onchange="onDepartmentChange()">
              <option value="">-- Select department --</option>
            </select>
            <div class="field-msg" id="departmentMsg"></div>
          </div>
          <div class="form-field">
            <select id="program" onchange="onGroupProgramChange()">
              <option value="">-- Select program --</option>
            </select>
            <div class="field-msg" id="programMsg"></div>
          </div>
          <div class="form-field">
            <select id="track" disabled>
              <option value="">-- Select track --</option>
            </select>
            <div class="field-msg" id="trackMsg"></div>
          </div>
          <div class="form-field">
            <input id="year_override" type="text" inputmode="numeric" placeholder="Year (auto, or override)" />
            <div class="field-msg" id="year_overrideMsg"></div>
          </div>
          <div class="form-field">
            <input id="student_count" type="text" inputmode="numeric" placeholder="Student count" />
            <div class="field-msg" id="student_countMsg"></div>
          </div>
          <div class="form-field">
            <label for="sub_group_count">Practice/lab subgroups</label>
            <input id="sub_group_count" type="number" min="1" value="3" />
          </div>
          <button type="submit" id="formSubmitBtn">Save Group</button>
        </form>
        <p id="formMsg" style="font-size:13px;"></p>
      </div>

      <div class="panel">
        <h2>Student Group Directory</h2>
        <p id="accessMsg" style="font-size:13px;color:#888;"></p>
        <input id="groupFilter" placeholder="Filter groups..." oninput="filterGroups()"
               style="margin-bottom:8px; padding:6px 10px; width:240px; border:1px solid #ccc; border-radius:6px;" />
        <table>
          <thead>
            <tr>
              <th>Group Code</th>
              <th>Program</th>
              <th>Track</th>       <!-- ★ 补上这一列 -->
              <th>Department</th>
              <th>Enrolled</th>
              <th>Current Year</th>
              <th>Students</th>
              <th id="actionCol">Actions</th>
            </tr>
          </thead>
          <tbody id="groupTable"></tbody>
        </table>
      </div>

    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
