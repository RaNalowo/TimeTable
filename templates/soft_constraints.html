<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Soft Constraints</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f3f4f6; margin: 0; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; padding: 16px 24px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
      flex-wrap: wrap; gap: 12px;
    }
    header h1 { margin: 0; font-size: 20px; }

    .panel {
      background: #fff; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
    }
    .panel h2 { margin-top: 0; font-size: 16px; }

    .soft-card {
      border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 16px; margin-bottom: 12px;
      background: #fff;
    }
    .soft-card.disabled { opacity: 0.55; }
    .soft-card h3 { margin: 0 0 4px; font-size: 15px; }
    .soft-card p { margin: 4px 0 12px; font-size: 13px; color: #555; }
    .soft-card code {
      background: #f3f4f6; padding: 2px 6px; border-radius: 4px;
      font-size: 12px; color: #374151;
    }

    .weight-row {
      display: flex; align-items: center; gap: 12px;
      margin-top: 8px;
    }
    .weight-row input[type="range"] {
      flex: 1; accent-color: #2563eb;
    }
    .weight-value {
      min-width: 42px; text-align: center; font-weight: bold;
      font-size: 15px; color: #2563eb;
      background: #eff6ff; padding: 2px 10px; border-radius: 6px;
    }
    .enable-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: #666;
      margin-top: 8px;
    }

    .row-actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 16px; padding-top: 12px; border-top: 1px solid #eee;
      flex-wrap: wrap; gap: 10px;
    }

    button.btn {
      padding: 8px 14px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    button.btn:hover { background: #1d4ed8; }
    button.btn-secondary {
      background: #6b7280;
    }
    button.btn-secondary:hover { background: #4b5563; }

    #msg { font-size: 13px; min-height: 18px; margin-top: 12px; }

    /* Score display */
    #scoreBox {
      background: #f9fafb; border-radius: 8px;
      padding: 16px; margin-top: 12px;
    }
    .score-header {
      display: flex; align-items: baseline; gap: 10px;
      margin-bottom: 12px;
    }
    .score-number {
      font-size: 40px; font-weight: bold; color: #16a34a;
    }
    .score-number.low { color: #dc2626; }
    .score-number.mid { color: #f59e0b; }
    .score-label { font-size: 13px; color: #666; }

    .score-bar {
      height: 12px; background: #e5e7eb; border-radius: 6px;
      overflow: hidden; margin-bottom: 14px;
    }
    .score-bar > div {
      height: 100%; background: #16a34a; transition: width 0.3s;
    }

    .breakdown-item {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 10px; align-items: center;
      padding: 8px 10px; margin-bottom: 6px;
      background: #fff; border-radius: 6px;
      border-left: 3px solid #2563eb;
      font-size: 13px;
    }
    .breakdown-item .name { font-weight: 500; }
    .breakdown-item .pill {
      padding: 2px 8px; border-radius: 10px;
      background: #f3f4f6; font-size: 12px; color: #374151;
    }
    .breakdown-item .penalty {
      color: #dc2626; font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-mount"></div>
    <main class="main-content">

      <header>
        <h1>Soft Constraints</h1>
      </header>

      <div class="panel">
        <h2>Preference Weights</h2>
        <p style="font-size:13px;color:#888;" id="accessMsg">
          Soft constraints are preferences, not rules. Higher weight = stronger preference.
        </p>

        <div id="softList"></div>

        <div class="row-actions">
          <button class="btn" onclick="saveAllWeights()">Save All Weights</button>
          <button class="btn btn-secondary" onclick="resetWeights()">Reset to Defaults</button>
        </div>

        <p id="msg"></p>
      </div>

      <div class="panel">
        <h2>Score Preview</h2>
        <p style="font-size:13px;color:#666;">
          Runs a sample schedule against the currently active soft constraints
          and shows how each preference contributes to the final score.
        </p>
        <button class="btn" onclick="runScorePreview()">Run Score Preview</button>
        <div id="scoreBox" style="display:none;"></div>
      </div>

    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
