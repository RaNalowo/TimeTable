<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Curriculum</title>
  <link rel="stylesheet" href="/static/css/base.css" />
  <style>

    /* 表单 Grid 布局 */
    form#courseForm {
      display: grid; gap: 16px;
      /* 稍微调大最小宽度，防止下拉框被挤压 */
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      align-items: start;
    }

    form#courseForm input, form#courseForm select {
      padding: 8px 10px; border: 1px solid #ccc;
      border-radius: 6px; font-size: 14px; width: 100%;
      height: 38px; /* 统一高度 */
    }

    form#courseForm input:disabled, form#courseForm select:disabled {
      background: #e5e7eb; color: #9ca3af; cursor: not-allowed;
    }

    form#courseForm input.input-error, form#courseForm select.input-error {
      border: 2px solid #dc2626;
    }

    .checkbox-field {
      display: flex; align-items: center; gap: 8px; height: 38px;
      font-size: 14px; color: #333; white-space: nowrap;
    }
    .checkbox-field input[type="checkbox"] {
      width: 16px; height: 16px; margin: 0; cursor: pointer;
    }

    form#courseForm button {
      padding: 9px 14px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; cursor: pointer;
      height: 38px; font-weight: 600; font-size: 14px;
      transition: background 0.15s;
    }
    form#courseForm button:hover { background: #1d4ed8; }

    #formMsg { margin: 12px 0 0; font-size: 14px; min-height: 18px; font-weight: 500; }

    /* 表格 */
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9fafb; font-weight: 600; color: #374151; }
    tr:hover { background: #f9fafb; }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 12px; background: #e0e7ff; color: #3730a3;
      white-space: nowrap;
    }
    .split {
      font-family: monospace; font-size: 12px;
      background: #f3f4f6; padding: 2px 6px; border-radius: 4px;
    }

    /* 过滤栏 */
    .toolbar-filter {
      display: flex; gap: 12px; align-items: center; margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .toolbar-filter input, .toolbar-filter select {
      padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 14px; outline: none;
    }
    .toolbar-filter input:focus, .toolbar-filter select:focus {
      border-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-mount"></div>
    <main class="main-content">

      <header>
        <h1>Manage Course Curriculum</h1>
      </header>

      <!-- Add Course Form -->
      <div class="panel" id="formPanel" style="display:none;">
        <h2 id="formTitle">Add Course</h2>

        <form id="courseForm" novalidate>
          <!-- Row 1 -->
          <div class="form-field">
            <input id="course_code" placeholder="Course Code (e.g., CS102)" />
            <div class="field-msg" id="course_codeMsg"></div>
          </div>

          <div class="form-field">
            <input id="course_name" placeholder="Course Name" />
            <div class="field-msg" id="course_nameMsg"></div>
          </div>

          <div class="form-field">
            <select id="department" onchange="onCourseDeptChange()">
              <option value="">-- Select department --</option>
              <option value="Engineering and Natural Sciences">Engineering and Natural Sciences</option>
              <option value="Education and Humanities">Education and Humanities</option>
              <option value="Business School">Business School</option>
              <option value="Law and Social Sciences">Law and Social Sciences</option>
            </select>
            <div class="field-msg" id="departmentMsg"></div>
          </div>

          <div class="form-field">
            <select id="program_id" onchange="onCourseProgramChange()">
              <option value="">-- Select program --</option>
            </select>
            <div class="field-msg" id="program_idMsg"></div>
          </div>

          <div class="form-field">
            <input id="credits" type="text" inputmode="numeric" placeholder="ECTS Credits (1-30)" />
            <div class="field-msg" id="creditsMsg"></div>
          </div>

          <!-- Row 2 -->
          <div class="form-field">
            <input id="semester_level" placeholder="Semester Level (e.g., Year 2 Fall)" />
            <div class="field-msg" id="semester_levelMsg"></div>
          </div>

          <div class="form-field">
            <input id="total_hours" type="text" inputmode="numeric" placeholder="Total Hours / week" />
            <div class="field-msg" id="total_hoursMsg"></div>
          </div>

          <div class="form-field">
            <input id="lecture_hours" type="text" inputmode="numeric" placeholder="Lecture Hours" />
            <div class="field-msg" id="lecture_hoursMsg"></div>
          </div>

          <div class="form-field">
            <input id="practice_hours" type="text" inputmode="numeric" placeholder="Practice Hours" />
            <div class="field-msg" id="practice_hoursMsg"></div>
          </div>

          <div class="form-field">
            <input id="lab_hours" type="text" inputmode="numeric" placeholder="Lab Hours" />
            <div class="field-msg" id="lab_hoursMsg"></div>
          </div>

          <!-- Row 3: Elective & Track -->
          <div class="checkbox-field">
            <input type="checkbox" id="is_elective" onchange="onElectiveChange()" />
            <label for="is_elective">Is Elective?</label>
          </div>

          <div class="form-field">
            <select id="track" disabled>
              <option value="">-- Select track --</option>
            </select>
            <div class="field-msg" id="trackMsg"></div>
          </div>

          <button type="submit" id="formSubmitBtn" style="grid-column: 1 / -1; width: 200px; margin-top: 10px;">
            Save Course
          </button>
        </form>

        <p id="formMsg"></p>
      </div>

      <!-- Curriculum Directory Table -->
      <div class="panel">
        <h2>Curriculum Directory</h2>
        <p id="accessMsg" style="font-size:13px;color:#888; margin-top:-5px; margin-bottom: 15px;"></p>

        <!-- Filter 区域 -->
        <div class="toolbar-filter">
          <input id="courseFilter" placeholder="Search courses..." oninput="filterCourses()" style="width:240px;" />
          <select id="filterProgram" onchange="filterCourses()">
            <option value="all">All Programs</option>
            <!-- dynamically filled by JS -->
          </select>
        </div>

        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th>Program</th>
              <th>Credits</th>
              <th>Level</th>
              <th>Split</th>
              <th>Type</th>
              <th>Track</th>
              <th>Department</th>
              <th id="actionCol">Actions</th>
            </tr>
          </thead>
          <tbody id="courseTable"></tbody>
        </table>
      </div>

    </main>
  </div>

  <script src="/static/js/core/api.js"></script>
  <script src="/static/js/core/ui.js"></script>
  <script src="/static/js/core/sidebar.js"></script>
  <script src="/static/js/master_data/courses.js"></script>
</body>
</html>
