<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Semesters</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f3f4f6; margin: 0; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; padding: 16px 24px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
      flex-wrap: wrap; gap: 12px;
    }
    header h1 { margin: 0; font-size: 20px; }

    .panel {
      background: #fff; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
    }
    .panel h2 { margin-top: 0; font-size: 16px; }

    form#semesterForm {
      display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      align-items: start;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    form#semesterForm input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
    }
    form#semesterForm input.input-error {
      border: 2px solid #dc2626;
    }
    form#semesterForm button {
      padding: 9px 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      height: 38px;
      align-self: start;
    }
    form#semesterForm button:hover { background: #1d4ed8; }

    .field-msg {
      color: #dc2626;
      font-size: 12px;
      min-height: 16px;
    }

    #formMsg { margin: 8px 0 0; font-size: 13px; min-height: 18px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9fafb; font-weight: 600; }
    tr:hover { background: #f9fafb; }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 12px;
    }
    .badge-active { background: #dcfce7; color: #166534; }
    .badge-inactive { background: #f3f4f6; color: #6b7280; }

    .btn-edit {
      padding: 4px 10px; background: #0891b2; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
      margin-right: 4px;
    }
    .btn-activate {
      padding: 4px 10px; background: #059669; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
      margin-right: 4px;
    }
    .btn-activate:disabled {
      background: #d1d5db; cursor: not-allowed;
    }
    .btn-del {
      padding: 4px 10px; background: #dc2626; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-mount"></div>
    <main class="main-content">

      <header>
        <h1>Manage Academic Semesters</h1>
        <span id="activeSemesterLabel" style="font-size:13px;color:#666;"></span>
      </header>

      <div class="panel" id="formPanel" style="display:none;">
        <h2 id="formTitle">Add Semester</h2>

        <form id="semesterForm" novalidate>
          <div class="form-field">
            <input id="name" placeholder="Semester name (e.g., 2026 Fall)" />
            <div class="field-msg" id="nameMsg"></div>
          </div>

          <div class="form-field">
            <input id="start_date" type="date" />
            <div class="field-msg" id="start_dateMsg"></div>
          </div>

          <div class="form-field">
            <input id="end_date" type="date" />
            <div class="field-msg" id="end_dateMsg"></div>
          </div>

          <button type="submit" id="formSubmitBtn">Save Semester</button>
        </form>

        <p id="formMsg"></p>
      </div>

      <div class="panel">
        <h2>Semester Directory</h2>
        <p id="accessMsg" style="font-size:13px;color:#888;"></p>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Start Date</th>
              <th>End Date</th>
              <th>Status</th>
              <th id="actionCol">Actions</th>
            </tr>
          </thead>
          <tbody id="semesterTable"></tbody>
        </table>
      </div>

    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
