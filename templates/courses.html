<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Curriculum</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f3f4f6; margin: 0; }
    .container { max-width: 1300px; margin: 0 auto; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; padding: 16px 24px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
      flex-wrap: wrap; gap: 12px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header a { color: #2563eb; text-decoration: none; font-size: 14px; }

    .panel {
      background: #fff; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
    }
    .panel h2 { margin-top: 0; font-size: 16px; }

    form#courseForm {
      display: grid; gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      align-items: end;
    }
    form#courseForm input, form#courseForm select {
      padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }
    form#courseForm button {
      padding: 9px 14px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; cursor: pointer;
    }
    form#courseForm button:hover { background: #1d4ed8; }

    #formMsg { margin: 8px 0 0; font-size: 13px; min-height: 18px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9fafb; font-weight: 600; }
    tr:hover { background: #f9fafb; }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 12px; background: #e0e7ff; color: #3730a3;
    }
    .split {
      font-family: monospace; font-size: 12px;
      background: #f3f4f6; padding: 2px 6px; border-radius: 4px;
    }
    .btn-del {
      padding: 4px 10px; background: #dc2626; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .btn-edit {
      padding: 4px 10px; background: #0891b2; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
  <div id="sidebar-mount"></div>
  <main class="main-content">

    <header>
      <h1>Manage Course Curriculum</h1>
      <a href="/dashboard.html">← Back to Dashboard</a>
    </header>

    <div class="panel" id="formPanel" style="display:none;">
      <h2 id="formTitle">Add Course</h2>
      <form id="courseForm">
        <input id="course_code" placeholder="Course Code (e.g., CS102)" required />
        <input id="course_name" placeholder="Course Name" required />
        <input id="credits" type="number" min="1" max="30" placeholder="ECTS Credits" required />
        <input id="semester_level" placeholder="Semester Level (e.g., Year 2, Spring)" />
        <input id="total_hours" type="number" min="1" max="20" placeholder="Total Hours / week" required />
        <input id="lecture_hours" type="number" min="0" max="20" placeholder="Lecture Hours" required />
        <input id="practice_hours" type="number" min="0" max="20" placeholder="Practice Hours" required />
        <input id="lab_hours" type="number" min="0" max="20" placeholder="Lab Hours" required />

        <div id="groupCheckboxes"
             style="grid-column: 1 / -1; border:1px solid #ccc; border-radius:6px; padding:10px; background:#fff;">
          <div style="font-size:12px;color:#888;margin-bottom:8px;">Target Student Groups</div>
          <div id="groupList"
               style="display:flex;flex-wrap:wrap;gap:10px;font-size:13px;">
            <!-- 由 JS 填充 -->
          </div>
        </div>

        <input id="department" placeholder="Department" />
        <button type="submit" id="formSubmitBtn">Save Course</button>
      </form>
      <p id="formMsg"></p>
    </div>

    <div class="panel">
      <h2>Curriculum Directory</h2>
      <p id="accessMsg" style="font-size:13px;color:#888;"></p>
      <input id="courseFilter" placeholder="Filter courses..." oninput="filterCourses()"
             style="margin-bottom:8px; padding:6px 10px; width:240px; border:1px solid #ccc; border-radius:6px;" />
      <table>
        <thead>
          <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Credits</th>
            <th>Level</th>
            <th>Split</th>
            <th>Total</th>
            <th>Target Groups</th>
            <th>Department</th>
            <th id="actionCol">Actions</th>
          </tr>
        </thead>
        <tbody id="courseTable"></tbody>
      </table>
    </div>

  </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
