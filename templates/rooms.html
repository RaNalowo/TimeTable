<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Rooms</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f3f4f6; margin: 0; padding: 24px; }
    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; padding: 16px 24px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
      flex-wrap: wrap; gap: 12px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header a { color: #2563eb; text-decoration: none; font-size: 14px; }

    .panel {
      background: #fff; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
    }
    .panel h2 { margin-top: 0; font-size: 16px; }

    form#roomForm {
      display: grid; gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      align-items: end;
    }
    form#roomForm input, form#roomForm select {
      padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }
    form#roomForm button {
      padding: 9px 14px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; cursor: pointer;
    }
    form#roomForm button:hover { background: #1d4ed8; }

    #formMsg { margin: 8px 0 0; font-size: 13px; min-height: 18px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9fafb; font-weight: 600; }
    tr:hover { background: #f9fafb; }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 12px; background: #e0e7ff; color: #3730a3;
    }
    .btn-del {
      padding: 4px 10px; background: #dc2626; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .btn-edit {
      padding: 4px 10px; background: #0891b2; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <h1>Manage Campus Rooms</h1>
      <a href="/dashboard.html">← Back to Dashboard</a>
    </header>

    <div class="panel" id="formPanel" style="display:none;">
      <h2 id="formTitle">Add Room</h2>
      <form id="roomForm">
        <input id="campus" placeholder="Campus (optional)" />
        <input id="building" placeholder="Building" required />
        <input id="room_code" placeholder="Room Code" required />
        <input id="capacity" type="number" min="1" placeholder="Capacity" required />
        <select id="room_type" required></select>
        <input id="equipment" placeholder="Equipment (comma separated)" />
        <button type="submit" id="formSubmitBtn">Save Room</button>
      </form>
      <p id="formMsg"></p>
    </div>

    <div class="panel">
      <h2>Room Directory</h2>
      <p id="accessMsg" style="font-size:13px;color:#888;"></p>
      <table>
        <thead>
          <tr>
            <th>Campus</th>
            <th>Building</th>
            <th>Room</th>
            <th>Capacity</th>
            <th>Type</th>
            <th>Equipment</th>
            <th id="actionCol">Actions</th>
          </tr>
        </thead>
        <tbody id="roomTable"></tbody>
      </table>
    </div>

  </div>
  <script src="/static/app.js"></script>
</body>
</html>
