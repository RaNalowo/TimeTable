<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prepare Scheduling Data</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f3f4f6; margin: 0; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; padding: 16px 24px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
      flex-wrap: wrap; gap: 12px;
    }
    header h1 { margin: 0; font-size: 20px; }

    .panel {
      background: #fff; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
    }
    .panel h2 { margin-top: 0; font-size: 16px; }

    .btn-check {
      padding: 10px 20px; background: #2563eb; color: #fff;
      border: none; border-radius: 8px; cursor: pointer;
      font-size: 15px; font-weight: 600;
    }
    .btn-check:hover { background: #1d4ed8; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .summary-card {
      background: #f9fafb; padding: 12px; border-radius: 8px;
      border-left: 3px solid #2563eb;
    }
    .summary-card .label { font-size: 11px; color: #888; text-transform: uppercase; }
    .summary-card .value { font-size: 18px; font-weight: bold; margin-top: 4px; }

    .banner {
      display: none;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 14px;
      align-items: center;
      gap: 12px;
    }
    .banner.show { display: flex; }
    .banner.ok {
      background: #dcfce7; color: #166534;
      border-left: 4px solid #16a34a;
    }
    .banner.fail {
      background: #fee2e2; color: #991b1b;
      border-left: 4px solid #dc2626;
    }
    .banner .count {
      font-weight: bold; font-size: 22px; margin-right: 4px;
    }

    .issue-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 10px;
      font-size: 13px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .issue-item .icon { font-size: 16px; flex-shrink: 0; }
    .issue-item .body { flex: 1; }
    .issue-item .type {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-right: 8px;
    }
    .issue-item.error {
      background: #fef2f2;
      border-left: 4px solid #dc2626;
      color: #7f1d1d;
    }
    .issue-item.error .type { background: #fecaca; color: #991b1b; }
    .issue-item.warning {
      background: #fffbeb;
      border-left: 4px solid #f59e0b;
      color: #78350f;
    }
    .issue-item.warning .type { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-mount"></div>
    <main class="main-content">

      <header>
        <h1>Prepare Scheduling Data</h1>
      </header>

      <div class="panel">
        <h2>Pre-flight Data Validation</h2>
        <p style="font-size:13px;color:#666;">
          Checks that courses, teachers, rooms, student groups, and time slots
          are complete before the AI generator runs. Fix any error before generating.
        </p>

        <button class="btn-check" onclick="runValidation()">Run Validation</button>

        <div id="summaryBox" style="display:none;">
          <div class="summary-grid" id="summaryGrid"></div>
        </div>
      </div>

      <div class="panel">
        <div id="resultBanner" class="banner"></div>
        <div id="issueList"></div>
      </div>

    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
