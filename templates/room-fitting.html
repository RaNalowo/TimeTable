<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Room Fitting</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f3f4f6; margin: 0; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; padding: 16px 24px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
      flex-wrap: wrap; gap: 12px;
    }
    header h1 { margin: 0; font-size: 20px; }

    .panel {
      background: #fff; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
    }
    .panel h2 { margin-top: 0; font-size: 16px; }

    form#fitForm {
      display: grid; gap: 12px;
      grid-template-columns: 1fr 2fr auto;
      align-items: end;
      max-width: 800px;
    }
    form#fitForm label {
      font-size: 12px; color: #555; margin-bottom: 4px; display: block;
    }
    form#fitForm select, form#fitForm input {
      padding: 8px 10px; border: 1px solid #ccc;
      border-radius: 6px; font-size: 14px; width: 100%;
    }
    form#fitForm button {
      padding: 9px 18px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; cursor: pointer;
      font-size: 14px; font-weight: 600;
    }
    form#fitForm button:hover { background: #1d4ed8; }

    #groupsBox {
      grid-column: 1 / -1;
      background: #f9fafb; border: 1px solid #e5e7eb;
      border-radius: 8px; padding: 12px;
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    #groupsBox label {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; cursor: pointer;
    }

    #summary {
      background: #eff6ff; border-left: 4px solid #2563eb;
      padding: 12px 16px; border-radius: 8px; font-size: 14px;
      margin-bottom: 16px;
    }
    #summary b { color: #1e40af; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9fafb; font-weight: 600; }
    tr.best { background: #dcfce7; }
    tr.fail { opacity: 0.55; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 11px; margin-right: 4px;
    }
    .badge.ok    { background: #dcfce7; color: #166534; }
    .badge.fail  { background: #fee2e2; color: #991b1b; }
    .badge.warn  { background: #fef3c7; color: #92400e; }
    .badge.info  { background: #e0e7ff; color: #3730a3; }

    .score-cell {
      font-weight: bold; font-size: 15px; color: #2563eb;
    }
    .score-cell.negative { color: #dc2626; }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-mount"></div>
    <main class="main-content">

      <header>
        <h1>Smart Room Capacity Auto-Fitting</h1>
      </header>

      <div class="panel">
        <h2>Session Requirements</h2>

        <form id="fitForm">
          <div>
            <label>Session Type</label>
            <select id="sessionType">
              <option value="lecture">Lecture</option>
              <option value="practice">Practice</option>
              <option value="lab">Lab</option>
            </select>
          </div>

          <div>
            <label>Course Code (optional)</label>
            <input id="courseCode" placeholder="e.g. CS201" />
          </div>

          <button type="submit">Suggest Rooms</button>

          <div id="groupsBox">
            <span style="font-size:12px;color:#666;flex-basis:100%;">Target Student Groups:</span>
            <!-- populated by JS -->
          </div>
        </form>
      </div>

      <div class="panel" id="resultPanel" style="display:none;">
        <h2>Ranked Room Candidates</h2>
        <div id="summary"></div>

        <table>
          <thead>
            <tr>
              <th>Room</th>
              <th>Building</th>
              <th>Type</th>
              <th>Capacity</th>
              <th>Equipment</th>
              <th>Checks</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>

    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
